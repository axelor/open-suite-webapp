# GitLab CI for open-suite-webapp.
#
# Port of the GitHub Actions workflow that lived in axelor-open-suite
# (.github/workflows/gradle.yml), seen from the webapp side: the webapp is
# checked out with its axelor-open-suite submodule, then the same Gradle checks,
# build and tests run.
#
# Pipelines run on merge requests and on pushes to dev / wip / *-dev.
#
# The SNAPSHOT publish lives in axelor-open-suite's .gitlab-ci.yml: it builds
# the tip of the AOS branch, not the commit pinned by this repository's
# submodule.

stages:
  - check
  - build
  - test

image: axelor/app-builder:8.2

variables:
  # The submodule URL in .gitmodules is git@github.com:..., which the runner
  # cannot use. Submodules are fetched manually in before_script over HTTPS.
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: 20
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid a duplicate branch pipeline when an MR is already open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "wip"
    - if: $CI_COMMIT_BRANCH =~ /^\d+\.\d+-dev$/

default:
  interruptible: true
  before_script:
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git submodule sync --recursive
    - git submodule update --init --recursive --depth 1
    - chmod +x gradlew
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    fallback_keys:
      - gradle-dev
    paths:
      - .gradle/wrapper
      - .gradle/caches

# Same static checks as the GitHub "Java CI" workflow. --continue reports every
# failing check, not only the first one.
# generateChangelog must run in its own Gradle invocation: it reads the whole
# project directory, so Gradle 8 fails its validation when it runs next to
# tasks that write there (spotlessJava, generateCode).
checks:
  stage: check
  needs: []
  script:
    - ./gradlew --continue
        spotlessCheck
        checkCsvEOL
        checkBirtCredentials
        checkXml
        checkJavaInjectAnnotationImport
    - ./gradlew generateChangelog

build:
  stage: build
  needs: []
  tags: [heavy]
  timeout: 2h
  script:
    - ./gradlew -xtest clean build

test:
  stage: test
  needs: []
  tags: [heavy]
  timeout: 3h
  script:
    - ./gradlew test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - "**/build/test-results/test/TEST-*.xml"
